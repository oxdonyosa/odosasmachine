<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Odosa's Machine — Backtest Data Export</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:#080b12;--bg2:#0d1220;--bg3:#111827;--bg4:#1a2235;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --green:#00e676;--red:#ff4d6d;--gold:#ffd740;--cyan:#00e5ff;--purple:#b388ff;
  --text:#e8eaf6;--text2:#8892a4;--text3:#4a5568;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);padding:1.5rem;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
.wrap{max-width:1000px;margin:0 auto;position:relative;z-index:1;}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;padding-bottom:1.25rem;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:1rem;}
.logo{display:flex;align-items:center;gap:12px;}
.logo-icon{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--cyan),var(--purple));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#080b12;}
.logo-text{font-size:18px;font-weight:800;}
.logo-sub{font-size:11px;color:var(--text2);font-family:'Space Mono',monospace;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:1rem;}
.card-title{font-size:11px;font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:1rem;display:flex;align-items:center;gap:8px;}
.card-title::after{content:'';flex:1;height:1px;background:var(--border);}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:1rem;}
.param-group{display:flex;flex-direction:column;gap:5px;}
.param-label{font-size:10px;color:var(--text2);font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:.5px;}
select,input{padding:7px 10px;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;font-size:12px;font-family:'Space Mono',monospace;color:var(--text);width:100%;outline:none;}
select:focus,input:focus{border-color:var(--cyan);}
.btn{padding:9px 20px;font-size:12px;font-family:'Space Mono',monospace;font-weight:700;letter-spacing:.5px;cursor:pointer;border:none;border-radius:8px;text-transform:uppercase;transition:opacity .2s,transform .15s;}
.btn:hover{opacity:.9;transform:translateY(-1px);}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btn-run{background:linear-gradient(135deg,var(--cyan),var(--purple));color:#080b12;}
.btn-csv{background:rgba(0,230,118,.1);color:var(--green);border:1px solid rgba(0,230,118,.25);}
.btn-json{background:rgba(255,215,64,.1);color:var(--gold);border:1px solid rgba(255,215,64,.3);}
.btns{display:flex;gap:10px;flex-wrap:wrap;}
.status{font-family:'Space Mono',monospace;font-size:11px;color:var(--cyan);padding:7px 12px;background:rgba(0,229,255,.05);border:1px solid rgba(0,229,255,.15);border-radius:7px;margin-bottom:1rem;min-height:34px;display:flex;align-items:center;gap:8px;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);animation:pulse 1.5s infinite;flex-shrink:0;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1rem;}
.stat{background:var(--bg3);border-radius:8px;padding:.75rem 1rem;border-top:2px solid;}
.stat-label{font-size:10px;font-family:'Space Mono',monospace;color:var(--text2);text-transform:uppercase;margin-bottom:4px;}
.stat-value{font-size:20px;font-weight:800;}
table{width:100%;border-collapse:collapse;font-size:11px;font-family:'Space Mono',monospace;}
th{text-align:left;padding:7px 10px;color:var(--text2);border-bottom:1px solid var(--border);font-size:9px;text-transform:uppercase;letter-spacing:.5px;background:var(--bg3);white-space:nowrap;}
td{padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
tr:hover td{background:rgba(255,255,255,.02);}
.tbl-wrap{border-radius:10px;border:1px solid var(--border);overflow:hidden;overflow-x:auto;}
.badge{display:inline-flex;align-items:center;padding:1px 6px;border-radius:4px;font-size:9px;font-weight:700;letter-spacing:.3px;}
.b-green{background:rgba(0,230,118,.1);color:var(--green);border:1px solid rgba(0,230,118,.25);}
.b-red{background:rgba(255,77,109,.1);color:var(--red);border:1px solid rgba(255,77,109,.25);}
.b-doji{background:rgba(255,255,255,.05);color:var(--text2);border:1px solid var(--border);}
.b-cyan{background:rgba(0,229,255,.1);color:var(--cyan);border:1px solid rgba(0,229,255,.25);}
.b-gold{background:rgba(255,215,64,.1);color:var(--gold);border:1px solid rgba(255,215,64,.3);}
.row-red{background:rgba(255,77,109,.04);}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px;}
</style>
</head>
<body>
<div class="wrap">

<div class="header">
  <div class="logo">
    <div class="logo-icon">OM</div>
    <div>
      <div class="logo-text">Odosa's Machine</div>
      <div class="logo-sub">Backtest Data Export</div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-title">Parameters</div>
  <div class="grid">
    <div class="param-group"><div class="param-label">Symbol</div>
      <select id="p-symbol">
        <option value="BTCUSDT" selected>BTCUSDT</option>
        <option value="ETHUSDT">ETHUSDT</option>
        <option value="SOLUSDT">SOLUSDT</option>
        <option value="BNBUSDT">BNBUSDT</option>
        <option value="XRPUSDT">XRPUSDT</option>
      </select>
    </div>
    <div class="param-group"><div class="param-label">Interval</div>
      <select id="p-interval">
        <option value="5m">5 minutes</option>
        <option value="15m" selected>15 minutes</option>
        <option value="30m">30 minutes</option>
        <option value="1h">1 hour</option>
      </select>
    </div>
    <div class="param-group"><div class="param-label">Target time (ET)</div>
      <input type="text" id="p-time" value="09:00" maxlength="5"/>
    </div>
    <div class="param-group"><div class="param-label">Lookback</div>
      <select id="p-months">
        <option value="1">1 month</option>
        <option value="2">2 months</option>
        <option value="3" selected>3 months</option>
        <option value="6">6 months</option>
        <option value="12">12 months</option>
      </select>
    </div>
    <div class="param-group"><div class="param-label">TZ offset</div>
      <input type="number" id="p-tz" value="1" min="-12" max="14" step="0.5"/>
    </div>
    <div class="param-group"><div class="param-label">TZ label</div>
      <input type="text" id="p-tz-label" value="WAT" maxlength="6"/>
    </div>
    <div class="param-group"><div class="param-label">Day filter</div>
      <select id="p-days">
        <option value="weekday" selected>Mon–Fri only</option>
        <option value="all">All 7 days</option>
      </select>
    </div>
  </div>
  <div class="btns">
    <button class="btn btn-run" id="runBtn" onclick="runBacktest()">▶ Fetch Backtest Data</button>
    <button class="btn btn-csv" id="csvBtn" onclick="exportCSV()" disabled>↓ Export CSV</button>
    <button class="btn btn-json" id="jsonBtn" onclick="exportJSON()" disabled>↓ Export JSON</button>
  </div>
</div>

<div class="status"><span class="dot"></span><span id="status">Configure parameters and click Fetch Backtest Data.</span></div>

<div id="results" style="display:none;">
  <div class="summary-grid" id="summary"></div>

  <div class="card">
    <div class="card-title">Target window — full backtest log</div>
    <div class="tbl-wrap" id="main-table"></div>
  </div>

  <div class="card">
    <div class="card-title">Off-bias days (missed direction)</div>
    <div class="tbl-wrap" id="off-table"></div>
  </div>

  <div class="card">
    <div class="card-title">Top 10 windows by consistency score</div>
    <div class="tbl-wrap" id="rank-table"></div>
  </div>

  <div class="card">
    <div class="card-title">Top 10 mirror pairs</div>
    <div class="tbl-wrap" id="mirror-table"></div>
  </div>
</div>

</div>

<script>
const BINANCE="https://api.binance.com/api/v3/klines";
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
let exportData=[];

function setStatus(m){document.getElementById('status').textContent=m;}

function getP(){
  return{
    symbol:document.getElementById('p-symbol').value,
    interval:document.getElementById('p-interval').value,
    targetTime:document.getElementById('p-time').value.trim(),
    months:parseInt(document.getElementById('p-months').value),
    tzOffset:parseFloat(document.getElementById('p-tz').value),
    tzLabel:document.getElementById('p-tz-label').value.trim()||'Local',
    dayFilter:document.getElementById('p-days').value,
  };
}

function intervalMs(iv){return({'5m':5,'15m':15,'30m':30,'1h':60}[iv]||15)*60*1000;}

function etOffsetMin(ts){
  const d=new Date(ts),y=d.getUTCFullYear();
  const s=new Date(Date.UTC(y,2,8,7,0,0)),e=new Date(Date.UTC(y,10,1,6,0,0));
  return(d>=s&&d<e)?-240:-300;
}

function toETHHMM(ts){
  const d=new Date(ts+etOffsetMin(ts)*60*1000);
  return d.getUTCHours().toString().padStart(2,'0')+':'+d.getUTCMinutes().toString().padStart(2,'0');
}

function etTimeToLocal(etStr,tzOffset){
  const[h,m]=etStr.split(':').map(Number);
  const etOff=etOffsetMin(Date.now());
  const utcMins=h*60+m-etOff;
  const localMins=((utcMins+tzOffset*60)%1440+1440)%1440;
  return Math.floor(localMins/60).toString().padStart(2,'0')+':'+String(localMins%60).padStart(2,'0');
}

function toLocalHHMM(ts,tz){
  const d=new Date(ts+tz*3600*1000);
  return d.getUTCHours().toString().padStart(2,'0')+':'+d.getUTCMinutes().toString().padStart(2,'0');
}

function getDOW_ET(ts){return new Date(ts+etOffsetMin(ts)*60*1000).getUTCDay();}
function isWeekday(ts){const d=getDOW_ET(ts);return d>=1&&d<=5;}
function dayLabel(ts){return DAYS[getDOW_ET(ts)];}
function fmtDate(ts){return new Date(ts).toISOString().slice(0,10);}
function isGreen(k){return parseFloat(k[4])>parseFloat(k[1]);}
function isRed(k){return parseFloat(k[4])<parseFloat(k[1]);}
function isDoji(k){return parseFloat(k[4])===parseFloat(k[1]);}
function dir(k){return isGreen(k)?1:isRed(k)?-1:0;}
function consist(g,r,t){return t?Math.max(g,r)/t*100:0;}
function etDateKey(ts){
  const d=new Date(ts+etOffsetMin(ts)*60*1000);
  return`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
}
function pct(n,d){return d?((n/d)*100).toFixed(1)+'%':'—';}

async function fetchKlines(symbol,interval,startMs,endMs){
  let all=[],from=startMs;
  const step=intervalMs(interval);
  while(from<endMs){
    const r=await fetch(`${BINANCE}?symbol=${symbol}&interval=${interval}&startTime=${from}&endTime=${endMs}&limit=1000`);
    const data=await r.json();
    if(!Array.isArray(data)||!data.length)break;
    all=all.concat(data);
    from=data[data.length-1][0]+step;
    if(data.length<1000)break;
  }
  return all;
}

async function runBacktest(){
  const p=getP();
  document.getElementById('runBtn').disabled=true;
  document.getElementById('runBtn').textContent='Loading...';
  document.getElementById('results').style.display='none';
  document.getElementById('csvBtn').disabled=true;
  document.getElementById('jsonBtn').disabled=true;

  try{
    const now=Date.now();
    const startMs=now-p.months*30*24*3600*1000;
    setStatus(`Fetching ${p.symbol} ${p.interval} from Binance...`);
    const klines=await fetchKlines(p.symbol,p.interval,startMs,now);
    const filtered=p.dayFilter==='weekday'?klines.filter(k=>isWeekday(k[0])):klines;
    setStatus(`${filtered.length} candles fetched. Analyzing ${p.targetTime} ET window...`);

    // target candles
    const tc=filtered.filter(k=>toETHHMM(k[0])===p.targetTime);
    const tg=tc.filter(k=>isGreen(k)).length;
    const tr=tc.filter(k=>isRed(k)).length;
    const td=tc.filter(k=>isDoji(k)).length;
    const tt=tc.length;
    const tSc=parseFloat(consist(tg,tr,tt).toFixed(1));
    const tDir=tg>=tr?'bullish':'bearish';
    const targetLocal=etTimeToLocal(p.targetTime,p.tzOffset);

    // window stats
    const wmap={};
    filtered.forEach(k=>{
      const et=toETHHMM(k[0]);
      if(!wmap[et])wmap[et]={green:0,red:0,doji:0,total:0};
      wmap[et].total++;
      if(isGreen(k))wmap[et].green++;
      else if(isRed(k))wmap[et].red++;
      else wmap[et].doji++;
    });

    const ranked=Object.entries(wmap)
      .filter(([,d])=>d.total>=10)
      .map(([time,d])=>({time,green:d.green,red:d.red,doji:d.doji,total:d.total,
        greenRate:parseFloat((d.green/d.total*100).toFixed(1)),
        redRate:parseFloat((d.red/d.total*100).toFixed(1)),
        score:parseFloat(consist(d.green,d.red,d.total).toFixed(1)),
        direction:d.green>=d.red?'bullish':'bearish'}))
      .sort((a,b)=>b.score-a.score);

    const tRank=ranked.findIndex(r=>r.time===p.targetTime)+1;

    // mirror pairs
    const dayMap={};
    filtered.forEach(k=>{
      const dk=etDateKey(k[0]),et=toETHHMM(k[0]);
      if(!dayMap[dk])dayMap[dk]={};
      dayMap[dk][et]=dir(k);
    });
    const allDays=Object.keys(dayMap);
    const validTimes=ranked.map(r=>r.time);
    const mirrors=[];
    for(let i=0;i<Math.min(validTimes.length,50);i++){
      for(let j=i+1;j<Math.min(validTimes.length,50);j++){
        const tA=validTimes[i],tB=validTimes[j];
        let same=0,opp=0,tot=0;
        allDays.forEach(dk=>{
          const dA=dayMap[dk][tA],dB=dayMap[dk][tB];
          if(dA===undefined||dB===undefined||dA===0||dB===0)return;
          tot++;if(dA===dB)same++;else opp++;
        });
        if(tot>=10)mirrors.push({timeA:tA,timeB:tB,same,opp,tot,
          score:parseFloat((same/tot*100).toFixed(1)),
          oppScore:parseFloat((opp/tot*100).toFixed(1))});
      }
    }
    mirrors.sort((a,b)=>b.score-a.score);

    // Build export data
    exportData=tc.map(k=>{
      const o=parseFloat(k[1]),c=parseFloat(k[4]),h=parseFloat(k[2]),l=parseFloat(k[3]),v=parseFloat(k[5]);
      const chg=((c-o)/o*100).toFixed(4);
      const result=isGreen(k)?'GREEN':isDoji(k)?'DOJI':'RED';
      const onBias=(tDir==='bullish'&&isGreen(k))||(tDir==='bearish'&&isRed(k));
      return{
        date:fmtDate(k[0]),
        day:dayLabel(k[0]),
        time_et:toETHHMM(k[0]),
        time_local:toLocalHHMM(k[0],p.tzOffset)+' '+p.tzLabel,
        open:o,high:h,low:l,close:c,
        change_pct:parseFloat(chg),
        volume:v,
        result,
        on_bias:onBias?'YES':'NO',
        bias:tDir,
      };
    }).sort((a,b)=>b.date.localeCompare(a.date));

    // Summary
    document.getElementById('summary').innerHTML=`
      <div class="stat" style="border-color:var(--cyan)"><div class="stat-label">Days scanned</div><div class="stat-value" style="color:var(--cyan)">${tt}</div></div>
      <div class="stat" style="border-color:var(--green)"><div class="stat-label">Green closes</div><div class="stat-value" style="color:var(--green)">${tg} <span style="font-size:14px;">(${pct(tg,tt)})</span></div></div>
      <div class="stat" style="border-color:var(--red)"><div class="stat-label">Red closes</div><div class="stat-value" style="color:var(--red)">${tr} <span style="font-size:14px;">(${pct(tr,tt)})</span></div></div>
      <div class="stat" style="border-color:var(--text3)"><div class="stat-label">Doji</div><div class="stat-value" style="color:var(--text2)">${td} <span style="font-size:14px;">(${pct(td,tt)})</span></div></div>
      <div class="stat" style="border-color:var(--gold)"><div class="stat-label">Consistency</div><div class="stat-value" style="color:var(--gold)">${tSc}%</div></div>
      <div class="stat" style="border-color:var(--purple)"><div class="stat-label">Rank</div><div class="stat-value" style="color:var(--purple)">#${tRank}<span style="font-size:14px;"> of ${ranked.length}</span></div></div>
      <div class="stat" style="border-color:${tDir==='bullish'?'var(--green)':'var(--red)'}"><div class="stat-label">Bias</div><div class="stat-value" style="color:${tDir==='bullish'?'var(--green)':'var(--red)'};font-size:16px;">${tDir.toUpperCase()}</div></div>
      <div class="stat" style="border-color:var(--cyan)"><div class="stat-label">Local equiv.</div><div class="stat-value" style="color:var(--cyan);font-size:16px;">${targetLocal} ${p.tzLabel}</div></div>
    `;

    // Main table
    let mh=`<table><thead><tr><th>Date</th><th>Day</th><th>ET</th><th>${p.tzLabel}</th><th>Open</th><th>High</th><th>Low</th><th>Close</th><th>Chg%</th><th>Volume</th><th>Result</th><th>On bias?</th></tr></thead><tbody>`;
    exportData.forEach(r=>{
      const chgColor=r.change_pct>=0?'var(--green)':'var(--red)';
      const badge=r.result==='GREEN'?'b-green':r.result==='RED'?'b-red':'b-doji';
      const biasBadge=r.on_bias==='YES'?'b-green':'b-red';
      mh+=`<tr><td>${r.date}</td><td><span class="badge b-doji">${r.day}</span></td><td style="color:var(--text2)">${r.time_et}</td><td><span class="badge b-cyan">${r.time_local}</span></td><td>$${r.open.toLocaleString()}</td><td style="color:var(--green)">$${r.high.toLocaleString()}</td><td style="color:var(--red)">$${r.low.toLocaleString()}</td><td>$${r.close.toLocaleString()}</td><td style="color:${chgColor}">${r.change_pct}%</td><td style="color:var(--text3)">${parseFloat(r.volume).toFixed(2)}</td><td><span class="badge ${badge}">${r.result}</span></td><td><span class="badge ${biasBadge}">${r.on_bias}</span></td></tr>`;
    });
    mh+='</tbody></table>';
    document.getElementById('main-table').innerHTML=mh;

    // Off-bias
    const offDays=exportData.filter(r=>r.on_bias==='NO');
    if(offDays.length===0){
      document.getElementById('off-table').innerHTML=`<div style="padding:1rem;text-align:center;color:var(--text3);font-family:'Space Mono',monospace;font-size:11px;">✓ No off-bias days — perfect consistency!</div>`;
    } else {
      let oh=`<table><thead><tr><th>#</th><th>Date</th><th>Day</th><th>Open</th><th>Close</th><th>Chg%</th><th>Result</th><th>Expected</th></tr></thead><tbody>`;
      offDays.forEach((r,i)=>{
        const badge=r.result==='GREEN'?'b-green':r.result==='RED'?'b-red':'b-doji';
        oh+=`<tr class="row-red"><td style="color:var(--text3)">${i+1}</td><td>${r.date}</td><td><span class="badge b-doji">${r.day}</span></td><td>$${r.open.toLocaleString()}</td><td>$${r.close.toLocaleString()}</td><td style="color:${r.change_pct>=0?'var(--green)':'var(--red)'}">${r.change_pct}%</td><td><span class="badge ${badge}">${r.result}</span></td><td><span class="badge ${tDir==='bullish'?'b-green':'b-red'}">${tDir==='bullish'?'GREEN':'RED'}</span></td></tr>`;
      });
      oh+='</tbody></table>';
      document.getElementById('off-table').innerHTML=oh;
    }

    // Top 10 windows
    let rh=`<table><thead><tr><th>Rank</th><th>Time (ET)</th><th>${p.tzLabel}</th><th>Direction</th><th>Green%</th><th>Red%</th><th>Score</th><th>Days</th></tr></thead><tbody>`;
    ranked.slice(0,10).forEach((r,i)=>{
      const isT=r.time===p.targetTime;
      rh+=`<tr style="${isT?'background:rgba(0,229,255,.04);':''}"><td><span class="badge ${i===0?'b-gold':'b-doji'}">${String(i+1).padStart(2,'0')}</span>${isT?' <span class="badge b-cyan" style="font-size:9px;">YOU</span>':''}</td><td style="color:${i===0?'var(--gold)':isT?'var(--cyan)':'var(--text)'};font-weight:${i===0||isT?700:400}">${r.time} ET</td><td><span class="badge b-cyan">${etTimeToLocal(r.time,p.tzOffset)} ${p.tzLabel}</span></td><td><span class="badge ${r.direction==='bullish'?'b-green':'b-red'}">${r.direction.toUpperCase()}</span></td><td style="color:var(--green)">${r.greenRate}%</td><td style="color:var(--red)">${r.redRate}%</td><td style="color:var(--gold);font-weight:${i===0?700:400}">${r.score}%</td><td style="color:var(--text3)">${r.total}</td></tr>`;
    });
    rh+='</tbody></table>';
    document.getElementById('rank-table').innerHTML=rh;

    // Top 10 mirrors
    let mph=`<table><thead><tr><th>Rank</th><th>Window A</th><th>Window B</th><th>Same dir%</th><th>Opposite%</th><th>Days</th><th>Your pair?</th></tr></thead><tbody>`;
    mirrors.slice(0,10).forEach((m,i)=>{
      const isT=m.timeA===p.targetTime||m.timeB===p.targetTime;
      mph+=`<tr class="${isT?'row-highlight':''}"><td><span class="badge ${i===0?'b-gold':'b-doji'}">${String(i+1).padStart(2,'0')}</span></td><td style="color:var(--text)">${m.timeA} ET<br><span class="badge b-cyan" style="margin-top:2px;display:inline-block;">${etTimeToLocal(m.timeA,p.tzOffset)} ${p.tzLabel}</span></td><td style="color:var(--text)">${m.timeB} ET<br><span class="badge b-cyan" style="margin-top:2px;display:inline-block;">${etTimeToLocal(m.timeB,p.tzOffset)} ${p.tzLabel}</span></td><td style="color:var(--purple);font-weight:${i===0?700:400}">${m.score}%</td><td style="color:#ff80ab">${m.oppScore}%</td><td style="color:var(--text3)">${m.tot}</td><td>${isT?'<span class="badge b-cyan">YES</span>':'<span class="badge b-doji">NO</span>'}</td></tr>`;
    });
    mph+='</tbody></table>';
    document.getElementById('mirror-table').innerHTML=mph;

    document.getElementById('results').style.display='block';
    document.getElementById('csvBtn').disabled=false;
    document.getElementById('jsonBtn').disabled=false;
    setStatus(`Done · ${tt} days analyzed · ${offDays.length} off-bias days · consistency ${tSc}% · rank #${tRank} of ${ranked.length} · live Binance data`);
  } catch(e){
    setStatus('Error: '+e.message);
  }
  document.getElementById('runBtn').disabled=false;
  document.getElementById('runBtn').textContent='▶ Fetch Backtest Data';
}

function exportCSV(){
  if(!exportData.length)return;
  const p=getP();
  const headers=Object.keys(exportData[0]).join(',');
  const rows=exportData.map(r=>Object.values(r).join(',')).join('\n');
  const blob=new Blob([headers+'\n'+rows],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`odosas_machine_${p.symbol}_${p.interval}_${p.targetTime.replace(':','')}_${p.months}mo.csv`;
  a.click();
}

function exportJSON(){
  if(!exportData.length)return;
  const p=getP();
  const blob=new Blob([JSON.stringify(exportData,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`odosas_machine_${p.symbol}_${p.interval}_${p.targetTime.replace(':','')}_${p.months}mo.json`;
  a.click();
}
</script>
</body>
